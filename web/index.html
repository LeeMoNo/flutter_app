<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_application_1">
  <!-- 没有这个，华为 WebView 会以 PC 模式渲染，双击缩放、滑动延迟都会出现 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>flutter_application_1</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      background-color: #ffffff;
      /* 白底，防止重绘间隙显灰 */
      overflow: hidden;
      /* Flutter 自己管滚动，禁用浏览器原生滚 */
      overscroll-behavior: none;
      /* 防止弹性回弹触发额外重绘 */
      -webkit-tap-highlight-color: transparent;
      /* 点击不闪灰 */
    }

    /* 强制把 Flutter 的 Canvas 提升到 GPU 独立层，减少合成器干预 */
    canvas,
    flt-glass-pane {
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
  </style>

</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
